services:
  postgres:
    image: postgres:latest
    restart: always
    volumes:
      - ./postgres-data:/var/lib/postgresql

    environment:
      POSTGRES_DB: qagen-db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_HOST_AUTH_METHOD: password
    ports:
      - "5434:5432" # 5434 (external port) : 5432 (internal port)
